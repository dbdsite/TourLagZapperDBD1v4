<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Temporarily Unavailable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Стильный зеленый градиент */
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Декоративный фоновый элемент для глубины */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(46, 204, 113, 0.15);
            border-radius: 50%;
            top: 10%;
            right: 15%;
            filter: blur(80px);
            z-index: 0;
        }

        .container {
            max-width: 650px;
            width: 100%;
            text-align: center;
            padding: 50px 40px;
            border-radius: 24px;
            /* Эффект матового стекла */
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            z-index: 1;
            animation: fadeIn 0.8s ease-out;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 25px;
            color: #2ecc71;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
            line-height: 1.3;
            background: linear-gradient(120deg, #ffffff, #a8ff78);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #b0bec5;
            font-weight: 400;
        }

        .highlight {
            color: #ffffff;
            font-weight: 600;
        }

        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 480px) {
            .container {
                padding: 35px 20px;
            }
            h1 {
                font-size: 1.7rem;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="#2ecc71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 16V12" stroke="#2ecc71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 8H12.01" stroke="#2ecc71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        
        <h1>This page is temporarily unavailable</h1>
        <p>
            Please go back and check out the Russian version of the page. 
            If you are an English speaker, you can use your <span class="highlight">browser's translation feature</span> to translate the page from Russian to English.
        </p>
    </div>

</body>
</html>
